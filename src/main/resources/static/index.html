<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MealGPT Agent</title>
    <link rel="icon" href="/assets/meal-gpt-logo.svg" type="image/svg+xml">
    <style>
        :root {
            font-family: Inter, Arial, "Malgun Gothic", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        aside { padding: 28px; background: #e6edf7; border-right: 1px solid #c9d6e8; }
        main { padding: 32px; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .brand img { width: 44px; height: 44px; border-radius: 8px; background: white; padding: 5px; }
        h1, h2, h3 { margin: 0; letter-spacing: 0; }
        h1 { font-size: 22px; }
        h2 { font-size: 34px; margin-bottom: 8px; }
        p { color: #5d6c82; line-height: 1.55; }
        .panel { background: white; border: 1px solid #d8e1ef; border-radius: 8px; padding: 20px; }
        .upload { max-width: 780px; margin-bottom: 22px; }
        .drop { position: relative; display: grid; place-items: center; min-height: 320px; border: 1px dashed #94a9c5; border-radius: 8px; overflow: hidden; background: #eef4fb; }
        .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
        .drop span { z-index: 1; text-align: center; color: #40526c; font-weight: 700; }
        .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        button { min-height: 42px; border: 0; border-radius: 8px; padding: 0 16px; background: #246bfe; color: white; font-weight: 800; cursor: pointer; }
        button.secondary { background: #dce8f7; color: #25415f; }
        button:disabled { opacity: .55; cursor: wait; }
        .grid { display: grid; grid-template-columns: .8fr 1.2fr .9fr; gap: 16px; align-items: start; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { min-height: 32px; border-radius: 999px; background: #e7f0ff; color: #1c58c9; padding: 6px 10px; font-size: 14px; }
        .recipe { border: 1px solid #d8e1ef; border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #f8fbff; }
        .cart-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e4ebf5; }
        .cart-item a { display: inline-grid; place-items: center; min-height: 34px; border-radius: 8px; padding: 0 12px; background: #246bfe; color: white; text-decoration: none; font-weight: 800; }
        #status { margin-top: 12px; padding: 12px; border-radius: 8px; background: #eef4fb; color: #40526c; }
        @media (max-width: 980px) { .layout, .grid { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #c9d6e8; } }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <div class="brand">
            <img src="/assets/meal-gpt-logo.svg" alt="MealGPT">
            <div>
                <h1>MealGPT Agent</h1>
                <p>Java + Ollama + OpenClaw</p>
            </div>
        </div>
        <p>냉장고 사진을 분석해 식재료를 찾고, 가능한 메뉴와 부족한 재료 장바구니를 정리합니다.</p>
    </aside>
    <main>
        <section class="upload panel">
            <h2>오늘의 재료를 확인해볼까요?</h2>
            <p>사진을 올리면 로컬 Ollama 비전 모델이 보이는 식재료만 추출합니다.</p>
            <label class="drop">
                <img id="preview" alt="업로드 미리보기">
                <input id="file" type="file" accept="image/*">
                <span id="dropText">이미지를 클릭하거나 끌어오세요</span>
            </label>
            <div class="actions">
                <button id="analyze">분석 시작</button>
                <button class="secondary" id="clear">장바구니 비우기</button>
            </div>
            <div id="status">준비됨</div>
        </section>

        <section class="grid">
            <div class="panel">
                <h3>인식된 재료</h3>
                <p></p>
                <div id="ingredients" class="chips"></div>
            </div>
            <div class="panel">
                <h3>추천 레시피</h3>
                <p></p>
                <div id="recipes"></div>
            </div>
            <div class="panel">
                <h3>장바구니</h3>
                <p></p>
                <div id="cart"></div>
            </div>
        </section>
    </main>
</div>

<script>
const file = document.getElementById("file");
const preview = document.getElementById("preview");
const dropText = document.getElementById("dropText");
const statusEl = document.getElementById("status");
const analyze = document.getElementById("analyze");

file.addEventListener("change", () => {
    const selected = file.files[0];
    if (!selected) return;
    preview.src = URL.createObjectURL(selected);
    preview.style.display = "block";
    dropText.textContent = selected.name;
    statusEl.textContent = "사진이 준비되었습니다.";
});

analyze.addEventListener("click", async () => {
    const selected = file.files[0];
    if (!selected) {
        alert("이미지를 먼저 선택하세요.");
        return;
    }
    const form = new FormData();
    form.append("file", selected);
    analyze.disabled = true;
    statusEl.textContent = "Ollama가 이미지를 분석하고 있습니다.";
    try {
        const response = await fetch("/analyze", { method: "POST", body: form });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || "분석 실패");
        renderIngredients(data.ingredients || []);
        renderRecipes(data.recipes || []);
        renderCart(data.cart || []);
        statusEl.textContent = data.warning || "분석이 완료되었습니다.";
    } catch (error) {
        statusEl.textContent = error.message;
    } finally {
        analyze.disabled = false;
    }
});

document.getElementById("clear").addEventListener("click", async () => {
    await fetch("/cart", { method: "DELETE" });
    renderCart([]);
    statusEl.textContent = "장바구니를 비웠습니다.";
});

async function addCart(name) {
    const response = await fetch("/cart/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, quantity: 1 })
    });
    const data = await response.json();
    renderCart(data.cart || []);
}

function renderIngredients(items) {
    const target = document.getElementById("ingredients");
    target.innerHTML = "";
    if (!items.length) {
        target.textContent = "인식된 재료가 없습니다.";
        return;
    }
    items.forEach(item => {
        const button = document.createElement("button");
        button.className = "chip";
        button.textContent = item;
        button.onclick = () => addCart(item);
        target.appendChild(button);
    });
}

function renderRecipes(items) {
    const target = document.getElementById("recipes");
    target.innerHTML = "";
    if (!items.length) {
        target.textContent = "추천 레시피가 없습니다.";
        return;
    }
    items.forEach(item => {
        const article = document.createElement("article");
        article.className = "recipe";
        article.innerHTML = `<h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.description || "")}</p>`;
        const chips = document.createElement("div");
        chips.className = "chips";
        (item.ingredients || []).forEach(name => {
            const button = document.createElement("button");
            button.className = "chip";
            button.textContent = name;
            button.onclick = () => addCart(name);
            chips.appendChild(button);
        });
        article.appendChild(chips);
        target.appendChild(article);
    });
}

function renderCart(items) {
    const target = document.getElementById("cart");
    target.innerHTML = "";
    if (!items.length) {
        target.textContent = "담긴 재료가 없습니다.";
        return;
    }
    items.forEach(item => {
        const row = document.createElement("div");
        row.className = "cart-item";
        row.innerHTML = `<div><strong>${escapeHtml(item.name)}</strong><br><span>${item.quantity || 1}개</span></div>`;
        const link = document.createElement("a");
        link.href = item.buy_url || item.buyUrl;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = "구매";
        row.appendChild(link);
        target.appendChild(row);
    });
}

function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[char]));
}

fetch("/cart").then(r => r.json()).then(data => renderCart(data.cart || []));
</script>
</body>
</html>
